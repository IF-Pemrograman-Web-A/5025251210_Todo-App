<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List Bagus Mantap</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>


    <header class="app-header">
    <h1>SimList</h1>
    <button id="theme-toggle" type="button" aria-pressed="false">🌙 Dark Mode</button>
    <button id="btn-notifikasi" type="button">🔔 Aktifkan Notifikasi</button>
    <p id="status-notifikasi" role="status"></p>
    </header>

    <div class="app-layout" id="konten-utama">

    <main class="panel-list">

      <!--form-->

      <section class="todo-list">
        <h2>Daftar Todo</h2>
        <ul id="todo-list-items" aria-live="polite">

        </ul>
      </section>

      <section class="todo-form">
        <h2>Tambah Task</h2>
        <form id="todo-form">
            <!-- isi form -->
            <label for="nama">Nama</label>
            <input type="text" id="nama" name="nama" placeholder="Nama task">

            <label for="deskripsi">Deskripsi</label>
            <textarea id="deskripsi" name="deskripsi" placeholder="Deskripsi task"></textarea>

            <label for="tanggal">Tanggal</label>
            <input type="date" id="tanggal" name="tanggal">

            <label for="waktu-notifikasi">Waktu Notifikasi</label>
            <input type="time" id="waktu-notifikasi" name="waktu-notifikasi">

            <label for="gambar">Gambar</label>
            <input type="file" id="gambar" name="gambar" accept="image/*">
            <img id="preview-gambar" alt="" hidden>

            <button type="button" id="btn-kamera">Buka Kamera</button>

              <div id="area-kamera" hidden>
              <video id="video-kamera" autoplay playsinline muted></video>
              <button type="button" id="btn-jepret">Ambil Foto</button>
              <button type="button" id="btn-tutup-kamera">Tutup Kamera</button>
            </div>

            <button type="submit">Tambah Task</button>
        </form>
      </section>

    </main>

    <aside class="panel-detail">
  <h2>Detail Todo</h2>
  <div class="todo-detail">
    <span class="todo-title">Belajar Jarkom</span>
    <span class="todo-deskripsi">Belajar PPT 1 Pak Roy</span>
    <span class="todo-status">Selesai</span>
  </div>
</aside>

    
  </div>

  <footer class="app-footer">
    <p>No Comot Comot Ya</p>
  </footer>

  <script src="script.js" defer></script>

</body>
</html>
